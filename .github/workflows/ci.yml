name: CI

# Stage 5 (Deploy): the agent can prepare a release, but a PR only merges when
# this pipeline is green AND a human has signed off. Verification is the gate,
# not the agent. See REVIEW.md and CLAUDE.md ("Testing / Stage 4").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Standard library only, so the suite must pass on every supported
        # interpreter (pyproject: requires-python >= 3.10).
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        # Canonical command from CLAUDE.md ("Commands"). No install step:
        # runtime and tests are standard library only (pyproject: dependencies = []).
        run: python -m unittest discover -s tests -t . -v
